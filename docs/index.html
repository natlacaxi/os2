<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MiniOS 10</title><meta name="theme-color" content="#0b1d51">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--acc:#0a84ff;--gl:.55;--blur:22px;--isz:60px;--tx:1;--gt:255,255,255;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
--abg:#f2f2f7;--afg:#111;--acard:#fff;--aline:rgba(60,60,67,.16);--alab:rgba(60,60,67,.62);--abar:rgba(249,249,252,.72)}
[data-theme=dark]{--abg:#000;--afg:#f2f2f7;--acard:#1c1c1e;--aline:rgba(255,255,255,.14);--alab:rgba(235,235,245,.6);--abar:rgba(24,24,28,.7);--gt:30,32,44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;font-size:calc(16px*var(--tx));overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
body.bold{font-weight:600}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#os{position:relative;width:100%;height:100%;overflow:hidden;background:#000;isolation:isolate}
@media (min-width:720px) and (hover:hover) and (pointer:fine){
 #stage{background:radial-gradient(1200px 700px at 50% 0%,#1d2540,#07080d)}
 #os{width:min(414px,100vw);height:min(896px,calc(100vh - 36px));border-radius:56px;box-shadow:0 0 0 11px #14161d,0 0 0 13px #2b2f3b,0 50px 140px rgba(0,0,0,.65)}
 #isl.fixed{opacity:1}
}
/* ===== VERRE LIQUIDE ===== */
.glass{position:relative;background:rgba(var(--gt),calc(.05 + var(--gl)*.30));
 -webkit-backdrop-filter:blur(var(--blur)) saturate(1.8) brightness(1.06);backdrop-filter:blur(var(--blur)) saturate(1.8) brightness(1.06);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.26),inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1.5px 2px rgba(255,255,255,.16),inset 0 0 22px rgba(255,255,255,.09),0 10px 30px rgba(0,0,0,.22)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(150deg,rgba(255,255,255,.5),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 68%,rgba(255,255,255,.2));opacity:calc(.35 + var(--gl)*.65)}
.lowT .glass,.lowT .gbar{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(40,42,54,.82)}
.saver *{animation:none!important}
/* ===== FOND D'ECRAN ===== */
#wall{position:absolute;inset:0;overflow:hidden;background:var(--w0,#0b1d51);z-index:0;background-size:cover;background-position:center}
#wall b{position:absolute;inset:-35%;background:conic-gradient(from 0deg,var(--w1),var(--w2),var(--w3),var(--w4),var(--w1));filter:blur(60px) saturate(1.5);opacity:.85;animation:spin 48s linear infinite;will-change:transform}
#wall i{position:absolute;width:75%;aspect-ratio:1;border-radius:50%;filter:blur(46px);opacity:.8;will-change:transform;animation:drift 19s ease-in-out infinite alternate}
#wall i:nth-of-type(1){background:radial-gradient(circle,var(--w2),transparent 68%);left:-25%;top:-8%}
#wall i:nth-of-type(2){background:radial-gradient(circle,var(--w3),transparent 68%);right:-30%;top:30%;animation-duration:25s;animation-delay:-8s}
#wall i:nth-of-type(3){background:radial-gradient(circle,var(--w4),transparent 68%);left:5%;bottom:-25%;animation-duration:21s;animation-delay:-4s}
#wall.photo b,#wall.photo i{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translate(22%,14%) scale(1.22)}}
.noanim #wall b,.noanim #wall i{animation:none}
#shade{position:absolute;inset:0;z-index:0;background:radial-gradient(120% 90% at 50% 0%,transparent,rgba(0,0,0,.18));pointer-events:none}
[data-theme=dark] #shade{background:rgba(0,0,0,.34)}
/* ===== BARRE D'ETAT ===== */
#sb{position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 46px);padding:calc(var(--sat) + 14px) 28px 0;display:flex;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:15px;z-index:70;pointer-events:none;transition:color .3s;text-shadow:0 0 8px rgba(0,0,0,.18)}
#sb .r{display:flex;gap:6px;align-items:center}
#os.sbd #sb{color:#000;text-shadow:none}
#os.sbd.dkc #sb{color:#fff}
#bat{display:flex;align-items:center;gap:3px;font-size:12px}
#bat s{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9;text-decoration:none;display:block;padding:1px}
#bat s::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
#bat s u{display:block;height:100%;background:currentColor;border-radius:2px;width:80%}
#isl{position:absolute;left:50%;top:calc(var(--sat) + 10px);transform:translateX(-50%);min-width:0;height:34px;border-radius:20px;background:#000;z-index:80;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;color:#fff;transition:all .35s cubic-bezier(.3,1.4,.5,1);opacity:0;pointer-events:none;width:0;overflow:hidden;white-space:nowrap}
#isl.on{opacity:1;width:var(--iw,150px);pointer-events:auto}
#isl.fixed{opacity:0}#isl.fixed.on{opacity:1}
@media (min-width:720px) and (hover:hover) and (pointer:fine){#isl:not(.on){opacity:1;width:112px}}
/* ===== ACCUEIL ===== */
#home{position:absolute;left:0;right:0;top:calc(var(--sat) + 46px);bottom:calc(var(--dockH,104px) + var(--sab) + 86px);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;z-index:2;transition:transform .45s cubic-bezier(.22,.9,.28,1),opacity .35s,filter .35s}
#home::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);grid-auto-rows:var(--cellH,96px);padding:8px 14px 0;align-content:start}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11.5px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.35);min-width:0}
.ic span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.nolab .ic span{display:none}
.ic:active .ico{transform:scale(.9);filter:brightness(.85)}
.ico{position:relative;width:var(--isz);height:var(--isz);border-radius:22.5%;display:grid;place-items:center;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.22),inset 0 2px 1px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.12);transition:transform .18s,filter .18s;font-style:normal;overflow:hidden}
.ico::before{content:"";position:absolute;left:-20%;right:-20%;top:-60%;height:100%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:.7;border-radius:50%}
.ico::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(200deg,rgba(255,255,255,.28),transparent 45%,rgba(255,255,255,.12));pointer-events:none}
.ico svg{width:56%;height:56%;color:#fff;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));stroke-width:1.9}
.ico b{position:relative;z-index:1;font-size:calc(var(--isz)*.3);font-weight:800;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 3px rgba(0,0,0,.3)}
.wd{grid-column:span 2;grid-row:span 2;margin:0 5px 14px;border-radius:30px;padding:14px 16px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.wd small{font-size:12px;opacity:.8;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.wd .big{font-size:40px;font-weight:300;line-height:1;letter-spacing:-1px}
.wd .t2{font-size:13px;opacity:.85}
.fld{border-radius:22.5%;background:rgba(var(--gt),.3);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);width:var(--isz);height:var(--isz);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 1px 1px rgba(255,255,255,.5)}
.fld .ico{width:100%;height:100%;box-shadow:none;border-radius:26%}
#dots{position:absolute;left:0;right:0;bottom:calc(var(--dockH,104px) + var(--sab) + 42px);display:flex;justify-content:center;gap:8px;z-index:3;transition:opacity .3s}
#dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4;transition:all .25s}
#dots i.on{opacity:1;transform:scale(1.2)}
#srchp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH,104px) + var(--sab) + 40px);display:none}
#dock{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 28px);height:var(--dockH,104px);border-radius:38px;z-index:3;display:flex;justify-content:space-evenly;align-items:center;padding:0 8px;transition:transform .45s cubic-bezier(.22,.9,.28,1),opacity .35s}
#dock .ic span{display:none}
@media (min-width:720px) and (pointer:coarse){#dock{left:50%;right:auto;transform:translateX(-50%);width:min(560px,92%)}}
#os.app #home,#os.app #dock,#os.app #dots,#os.sw #home,#os.sw #dock,#os.sw #dots{transform:scale(.9);opacity:0;pointer-events:none;filter:blur(8px)}
#os.app #dock,#os.sw #dock{transform:scale(.9) translateY(40px)}
@media (min-width:720px) and (pointer:coarse){#os.app #dock,#os.sw #dock{transform:translateX(-50%) scale(.9) translateY(40px)}}
/* ===== FENETRES ===== */
#wins{position:absolute;inset:0;z-index:10;pointer-events:none}
.win{position:absolute;inset:0;background:var(--abg);color:var(--afg);display:flex;flex-direction:column;overflow:hidden;transform-origin:var(--ox,50%) var(--oy,88%);transform:scale(.12);opacity:0;visibility:hidden;pointer-events:none;border-radius:48px;
 transition:transform .46s cubic-bezier(.22,.9,.28,1),opacity .28s ease,border-radius .46s,visibility 0s .46s;will-change:transform}
.win.on{transform:none;opacity:1;visibility:visible;pointer-events:auto;border-radius:0;transition:transform .46s cubic-bezier(.22,.9,.28,1),opacity .2s ease,border-radius .46s,visibility 0s}
.win.card{transform-origin:50% 50%!important;border-radius:38px!important;pointer-events:none!important;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.win.drag{transition:none!important}
.win.dk{--abg:#000;--afg:#fff;--acard:#1c1c1e;--aline:rgba(255,255,255,.14);--alab:rgba(235,235,245,.6);--abar:rgba(24,24,28,.7)}
.nav{position:relative;z-index:5;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:calc(var(--sat) + 48px) 16px 10px;min-height:calc(var(--sat) + 96px);background:var(--abar);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border-bottom:.5px solid var(--aline)}
.nav .nt{font-size:17px;font-weight:650;position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none}
.nav .nl,.nav .nr{display:flex;gap:8px;z-index:1;align-items:center;min-height:32px}
.nav.big{flex-direction:column;align-items:stretch;gap:4px}.nav.big .nt{position:static;text-align:left;font-size:32px;font-weight:800;letter-spacing:-.5px;pointer-events:auto}.nav.big .nl{order:-1;justify-content:space-between}
.nav.hide{display:none}
.wb{flex:1;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sab) + 44px);position:relative;scrollbar-width:none}
.wb::-webkit-scrollbar{display:none}
.wb.np{padding:0}
.tb{background:none;color:var(--acc);font-size:16px;font-weight:500;padding:6px 10px;border-radius:16px;display:flex;align-items:center;gap:4px}
.tb:active{opacity:.5}
.tb svg{width:22px;height:22px}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:11px 18px;font-weight:600;font-size:16px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(.85);transform:scale(.98)}
.btn.g{background:rgba(120,120,128,.2);color:var(--afg)}.btn.r{background:#ff3b30}.btn.sm{padding:7px 13px;font-size:14px;border-radius:12px}.btn.w{display:flex;width:100%}
.in{width:100%;padding:12px 14px;border-radius:13px;border:0;background:var(--acard);color:var(--afg);font-size:16px;outline:none;box-shadow:inset 0 0 0 .5px var(--aline)}
.grp{background:var(--acard);border-radius:18px;margin:0 0 18px;overflow:hidden}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:48px;border-bottom:.5px solid var(--aline);font-size:16px;position:relative}
.rw:last-child{border:0}.rw>span:first-child{display:flex;align-items:center;gap:12px;min-width:0}
.rw .v{color:var(--alab);display:flex;align-items:center;gap:6px;white-space:nowrap}
.rw.lnk{cursor:pointer}.rw.lnk:active{background:var(--aline)}
.rw.lnk::after{content:"";width:8px;height:8px;border-right:2px solid var(--alab);border-top:2px solid var(--alab);transform:rotate(45deg);opacity:.6;margin-left:4px;flex:0 0 auto}
.rw.lnk .v{margin-left:auto}
.gh{font-size:13px;color:var(--alab);text-transform:uppercase;margin:6px 16px 7px;letter-spacing:.3px}
.gf{font-size:13px;color:var(--alab);margin:-10px 16px 18px}
.si{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:0 0 auto}.si svg{width:19px;height:19px}
.tg{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;flex:0 0 auto;transition:background .25s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tg.on{background:#34c759}.tg.on::after{transform:translateX(20px)}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;width:100%;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p,50%),rgba(120,120,128,.3) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(0,0,0,.1)}
.seg{display:flex;background:rgba(120,120,128,.2);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 10px;border-radius:9px;font-size:14px;font-weight:500;color:var(--afg);white-space:nowrap}
.seg button.on{background:var(--acard);box-shadow:0 2px 6px rgba(0,0,0,.18);font-weight:650}
.tabs{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 26px);height:62px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;z-index:6;color:#fff;background:var(--abar);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);box-shadow:inset 0 0 0 .5px var(--aline),0 10px 30px rgba(0,0,0,.18)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--alab);padding:6px 12px;border-radius:24px;transition:all .2s}
.tabs button svg{width:24px;height:24px}.tabs button.on{color:var(--acc);background:rgba(120,120,128,.18)}
.empty{text-align:center;color:var(--alab);padding:60px 20px;font-size:15px}
.empty svg{width:56px;height:56px;margin:0 auto 12px;opacity:.5}
.sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet>div{width:100%;background:var(--abg);border-radius:30px 30px 0 0;padding:20px 16px calc(var(--sab) + 28px);transform:translateY(100%);transition:transform .4s cubic-bezier(.22,.9,.28,1);max-height:86%;overflow:auto}
.sheet.on>div{transform:none}
/* ===== BARRE / GESTES ===== */
#gest{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sab) + 34px);z-index:90;touch-action:none}
#os.locked #gest{pointer-events:none}
#hbar{position:absolute;left:50%;bottom:calc(var(--sab) + 8px);width:min(138px,34%);height:5px;margin-left:calc(min(138px,34%)/-2);border-radius:3px;background:#fff;opacity:.9;z-index:91;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.3);transition:background .3s}
#os.sbd #hbar{background:#000;box-shadow:none}#os.sbd.dkc #hbar{background:#fff}
#tz{position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 26px);z-index:89;touch-action:none}
#os.locked #tz{pointer-events:none}
/* ===== SWITCHER ===== */
#swv{position:absolute;inset:0;z-index:50;display:none;touch-action:none;background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}
#os.sw #swv{display:block}
.swc{position:absolute;pointer-events:auto}
.swc .lb{position:absolute;left:0;right:0;top:-34px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.swc .lb .ico{width:24px;height:24px;border-radius:7px}.swc .lb .ico svg{width:14px;height:14px}
.swc .lb .ico b{font-size:8px}
#swall{position:absolute;left:50%;bottom:calc(var(--sab) + 56px);transform:translateX(-50%);padding:10px 22px;border-radius:22px;font-weight:600;font-size:15px;color:#fff}
#swe{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:18px;opacity:.8;pointer-events:none}
/* ===== VERROUILLAGE ===== */
#lock{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--sat) + 64px);touch-action:none;transition:transform .5s cubic-bezier(.5,0,.2,1),opacity .4s}
#lock::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.3));pointer-events:none}
#lock.off{transform:translateY(-105%);pointer-events:none}
#lock.drag{transition:none}
#ld{font-size:20px;font-weight:600;opacity:.92;text-shadow:0 1px 10px rgba(0,0,0,.2);position:relative}
#lt{font-size:min(30vw,118px);font-weight:700;line-height:1.02;letter-spacing:-3px;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 18px rgba(0,0,0,.18));-webkit-text-stroke:.6px rgba(255,255,255,.35)}
#lw{position:relative;margin-top:14px;display:flex;gap:10px;min-height:20px;font-size:13px;font-weight:600}
#ln{position:relative;width:min(92%,380px);margin-top:18px;display:flex;flex-direction:column;gap:8px;max-height:30%;overflow:hidden}
.nt2{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:22px;font-size:13px;text-align:left;color:#fff}
.nt2 .ico{width:34px;height:34px;flex:0 0 auto;border-radius:9px}.nt2 .ico svg{width:19px;height:19px}.nt2 b{display:block;font-size:14px}.nt2 div{min-width:0}.nt2 div span{opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbt{position:absolute;bottom:calc(var(--sab) + 52px);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff}
.lbt svg{width:24px;height:24px}
#lh{position:absolute;bottom:calc(var(--sab) + 22px);font-size:13px;opacity:.8;left:0;right:0;text-align:center;font-weight:500;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{50%{transform:translateY(-6px);opacity:.5}}
#pad{position:absolute;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:2}
#pad.on{display:flex}
#pad .pd{font-size:28px;letter-spacing:12px;min-height:40px}
#pad .pk{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
#pad .pk button{height:76px;border-radius:50%;background:rgba(255,255,255,.18);font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
#pad .pk button:active{background:rgba(255,255,255,.4)}
#pad .cx{font-size:16px;opacity:.85}
/* ===== NOTIF / CC ===== */
#ntf{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 8px);z-index:95;transform:translateY(-160%);transition:transform .5s cubic-bezier(.3,1.3,.5,1);pointer-events:none;max-width:420px;margin:0 auto}
#ntf.on{transform:none;pointer-events:auto}
#ntf .nt2{border-radius:26px;padding:12px 14px}
